name: Nextflow CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  pull_request:
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  workflow_dispatch:
    inputs:
      species_taxid:
        description: 'NCBI taxid for the target species'
        required: false
        default: '10090'
        type: string
      species_name:
        description: 'Species name used in logs and outputs'
        required: false
        default: 'Mus musculus'
        type: string
      candidates:
        description: 'Path to a candidate proteins FASTA file (required for full run)'
        required: false
        default: ''
        type: string
      geneid_param:
        description: 'Path to the GeneID parameter file (required for full run)'
        required: false
        default: ''
        type: string
      output_dir:
        description: 'Where to write workflow outputs'
        required: false
        default: 'results-ci'
        type: string

jobs:
  nextflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
            curl -s https://get.nextflow.io | bash
            chmod +x nextflow
            echo "$PWD" >> $GITHUB_PATH

      - name: Show Docker availability
        run: docker --version
    
      - name: Pull Docker images
        run: |
            docker pull biocontainers/samtools:v1.9-4-deb_cv1
            docker pull maxtico/selenoprofiles_container:v4.5.7
            docker pull quay.io/biocontainers/agat:1.5.0--pl5321hdfd78af_0
            docker pull quay.io/biocontainers/seqkit:2.3.0--h9ee0642_0
            docker pull quay.io/biocontainers/gffread:0.12.7--h077b44d_6
            docker pull maxtico/seblastian:latest
            docker pull ileahy/biopythonimage:latest
            docker pull biocontainers/samtools:v1.9-4-deb_cv1
      - name: Install annocli
        if: steps.conda-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
            git clone --branch v1.0.0 --depth 1 https://github.com/apollo994/annocli.git
            pip install ./annocli/

      - name: Run pipeline for each mammal from mammals_to_search.tsv
        shell: bash
        env:
          RUN_FULL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_full == 'true' }}
          GENEID_PARAM: human3iso.param
          OUTPUT_ROOT: ${{ github.workspace }}/results-ci
        run: |
          set -euo pipefail

          if [ ! -f mammals_to_search.tsv ]; then
            echo "mammals_to_search.tsv not found" >&2
            exit 1
          fi

          completion_file="${{ github.workspace }}/completion_report.tsv"
          echo -e "taxid\tspecies\tstatus\toutput_dir\tnotes" > "$completion_file"

          while IFS=$'\t' read -r taxid species class; do
            [ -z "${taxid:-}" ] && continue
            [ "${taxid#\#}" != "$taxid" ] && continue

            taxid="$(echo "$taxid" | tr -d '[:space:]')"
            species="$(echo "$species" | tr -d '[:space:]')"
            [ -z "$species" ] && species="species_${taxid}"

            safe_name=$(echo "$species" | tr ' /:' '__' | tr -cd '[:alnum:]._-')
            output_dir="$OUTPUT_ROOT/$safe_name"
            mkdir -p "$output_dir"

            if [ -f "$output_dir/completion.txt" ] || [ -d "$output_dir/work" ]; then
              echo "Skipping $species ($taxid): existing outputs found in $output_dir"
              echo -e "$taxid\t$species\tskipped\t$output_dir\texisting outputs found" >> "$completion_file"
              continue
            fi

            nextflow run main_mammal.nf \
                -profile local \
                --species_taxid "$taxid" \
                --species_name "$species" \
                --geneid_param "$GENEID_PARAM" \
                --output_dir "$output_dir" \
                --max_cpus 2 \
                --max_memory '6GB' 
            

            echo -e "$taxid\t$species\t$status\t$output_dir\t$notes" >> "$completion_file"
          done < mammals_to_search.tsv

          echo "Completion report written to $completion_file"
          cat "$completion_file"

      - name: Upload completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-report
          path: |
            completion_report.tsv
            results-ci/**/ORFsearch_SECIS.result
