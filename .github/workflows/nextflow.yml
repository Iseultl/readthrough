name: ORFsearch Mammals

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  pull_request:
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  workflow_dispatch:
    inputs:
      species_taxid:
        description: 'NCBI taxid for the target species'
        required: false
        default: '10090'
        type: string
      species_name:
        description: 'Species name used in logs and outputs'
        required: false
        default: 'Mus musculus'
        type: string
      candidates:
        description: 'Path to a candidate proteins FASTA file (required for full run)'
        required: false
        default: ''
        type: string
      geneid_param:
        description: 'Path to the GeneID parameter file (required for full run)'
        required: false
        default: ''
        type: string
      output_dir:
        description: 'Where to write workflow outputs'
        required: false
        default: 'results-ci'
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
        matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
        - uses: actions/checkout@v4

        - id: matrix
          run: |
            matrix=$(awk '
            BEGIN{
                FS="\t"
                print "["
            }
            !/^#/ && NF>=2{
                gsub(/ /,"_",$2)
                printf "%s{\"taxid\":\"%s\",\"species\":\"%s\"}",
                    (NR==1?"":","),
                    $1,
                    $2
            }
            END{
                print "]"
            }' mammals_to_search.tsv)

            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  nextflow:
    needs: generate-matrix

    strategy:
        fail-fast: false
        max-parallel: 5

        matrix:
          include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
            curl -s https://get.nextflow.io | bash
            chmod +x nextflow
            echo "$PWD" >> $GITHUB_PATH

      - name: Show Docker availability
        run: docker --version
    
      - name: Pull Docker images
        run: |
            docker pull biocontainers/samtools:v1.9-4-deb_cv1
            docker pull maxtico/selenoprofiles_container:v4.5.7
            docker pull quay.io/biocontainers/agat:1.5.0--pl5321hdfd78af_0
            docker pull quay.io/biocontainers/seqkit:2.3.0--h9ee0642_0
            docker pull quay.io/biocontainers/gffread:0.12.7--h077b44d_6
            docker pull maxtico/seblastian:latest
            docker pull ileahy/biopythonimage:latest

      - name: Install annocli
        if: steps.conda-cache.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
            git clone --branch v1.0.0 --depth 1 https://github.com/apollo994/annocli.git
            pip install ./annocli/
      - name: Show matrix values
        run: |
            echo "TaxID: ${{ matrix.taxid }}"
            echo "Species: ${{ matrix.species }}"

      - name: Run pipeline for matrix species
        shell: bash
        env:
          RUN_FULL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_full == 'true' }}
          GENEID_PARAM: human3iso.param
          OUTPUT_ROOT: ${{ github.workspace }}/results-ci
        run: |
          set -euo pipefail

          taxid="${{ matrix.taxid }}"
          species="${{ matrix.species }}"

          nextflow run main_mammal.nf \
            -profile local \
            --species_taxid "$taxid" \
            --species_name "$species" \
            --geneid_param "$GENEID_PARAM" \
            --output_dir "$OUTPUT_ROOT" \
            --max_cpus 2 \
            --max_memory '6GB' 
            
      - name: Upload completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORFsearch-${{ matrix.taxid }}
          path: |
            results-ci/**/*SECIS.result
