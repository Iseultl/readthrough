name: ORFsearch Mammals

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  pull_request:
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  workflow_dispatch:
    inputs:
      species_taxid:
        description: 'NCBI taxid for the target species'
        required: false
        default: '10090'
        type: string
      species_name:
        description: 'Species name used in logs and outputs'
        required: false
        default: 'Mus musculus'
        type: string
      start:
        description: "First row to process"
        default: "1"
        type: string
      count:
        description: "Number of species to process"
        default: "100"
        type: string
      geneid_param:
        description: 'Path to the GeneID parameter file (required for full run)'
        required: false
        default: ''
        type: string
      output_dir:
        description: 'Where to write workflow outputs'
        required: false
        default: 'results-ci'
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
        matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
        - uses: actions/checkout@v4

        - id: matrix
          shell: bash
          run: |
            start=${{ github.event.inputs.start || '1' }}
            count=${{ github.event.inputs.count || '100' }}

            matrix=$(awk -v start="$start" -v count="$count" '
            BEGIN {
                FS="\t"
                printf "["
                first=1
                idx=0
            }

            !/^#/ && NF>=2 {
                idx++

                if (idx < start)
                    next

                if (idx >= start + count)
                    next

                gsub(/ /, "_", $2)

                if (!first)
                    printf ","

                printf "{\"taxid\":\"%s\",\"species\":\"%s\"}", $1, $2
                first=0
            }

            END {
                printf "]"
            }
            ' mammals_to_search.tsv)

            echo "Generated matrix:"
            echo "$matrix"

            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  nextflow:
    container:
      image: ghcr.io/iseultl/readthrough:latest
    
    needs: 
      - generate-matrix

    strategy:
        fail-fast: false
        max-parallel: 5

        matrix:
          include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af
          df -h
    
      - name: Show matrix values
        run: |
            echo "TaxID: ${{ matrix.taxid }}"
            echo "Species: ${{ matrix.species }}"

      - name: Run pipeline for matrix species
        shell: bash
        env:
          RUN_FULL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_full == 'true' }}
          GENEID_PARAM: human3iso.param
          OUTPUT_ROOT: ${{ github.workspace }}/results-ci
        run: |
          set -euo pipefail

          taxid="${{ matrix.taxid }}"
          species="${{ matrix.species }}"

          # Run Nextflow
          nextflow run main_mammal.nf \
            -profile local \
            --species_taxid "$taxid" \
            --species_name "$species" \
            --geneid_param "$GENEID_PARAM" \
            --output_dir "$OUTPUT_ROOT" \
            --max_cpus 2 \
            --max_memory '6GB'

          nextflow clean -f
            
      - name: Upload completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORFsearch-${{ matrix.taxid }}
          path: |
            results-ci/**/*SECIS.result