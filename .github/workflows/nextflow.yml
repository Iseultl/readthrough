name: ORFsearch Mammals

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  pull_request:
    paths:
      - 'main_mammal.nf'
      - 'modules/**'
      - 'bin/**'
      - 'nextflow.config'
      - '.github/workflows/nextflow.yml'
  workflow_dispatch:
    inputs:
      start:
        description: "First row to process"
        default: "1"
        type: string
      count:
        description: "Number of species to process"
        default: "10"
        type: string
      geneid_param:
        description: 'Path to the GeneID parameter file (required for full run)'
        required: false
        default: "human3iso.param"
        type: string
      output_dir:
        description: 'Where to write workflow outputs'
        required: false
        default: 'results-ci'
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
        matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
        - uses: actions/checkout@v4

        - id: matrix
          shell: bash
          run: |
            start=${{ github.event.inputs.start || '1' }}
            count=${{ github.event.inputs.count || '253' }}

            matrix=$(awk -v start="$start" -v count="$count" '
            BEGIN {
                FS="\t"
                printf "["
                first=1
                idx=0
            }

            !/^#/ && NF>=6 {
                idx++

                if (idx < start)
                    next

                if (idx >= start + count)
                    next

                gsub(/ /, "_", $3)

                if (!first)
                    printf ","

                printf "{\"taxid\":\"%s\",\"species\":\"%s\",\"annotation_url\":\"%s\",\"fasta_url\":\"%s\"}", $2, $3, $5, $6
                first=0
            }

            END {
                printf "]"
            }
            ' mammalia_annotations.tsv)

            echo "Generated matrix:"
            echo "$matrix"

            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  nextflow:
    needs: 
      - generate-matrix

    strategy:
        fail-fast: false
        max-parallel: 253

        matrix:
          include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          df -h
    
      - name: Show matrix values
        run: |
            echo "TaxID: ${{ matrix.taxid }}"
            echo "Species: ${{ matrix.species }}"
            echo "Annotation URL: ${{ matrix.annotation_url }}"
            echo "FASTA URL: ${{ matrix.fasta_url }}"

      - name: Run pipeline for matrix species
        shell: bash
        env:
          NXF_OPTS: -Xms256m -Xmx1g
          GENEID_PARAM: ${{ github.workspace }}/human3iso.param
          OUTPUT_ROOT: ${{ github.event.inputs.output_dir || 'results-ci' }}
        run: |
          set -euo pipefail

          taxid="${{ matrix.taxid }}"
          species="${{ matrix.species }}"
          annotation_url="${{ matrix.annotation_url }}"
          fasta_url="${{ matrix.fasta_url }}"
          output_root="${GITHUB_WORKSPACE}/${OUTPUT_ROOT}"
          retry_list="${GITHUB_WORKSPACE}/retry-list.tsv"

          if [[ ! -f "$retry_list" ]]; then
            printf 'taxid\tspecies\tannotation_url\tfasta_url\tstatus\n' > "$retry_list"
          fi

          sleep_seconds=$(( (RANDOM % 15) + 5 ))
          echo "Sleeping ${sleep_seconds}s before starting ${taxid} to reduce burst pressure"
          sleep "$sleep_seconds"

          set +e

          nextflow run main_mammal.nf \
            -profile local \
            --species_taxid "$taxid" \
            --species_name "$species" \
            --annotation_url "$annotation_url" \
            --fasta_url "$fasta_url" \
            --geneid_param "$GENEID_PARAM" \
            --output_dir "$output_root" \
            --max_cpus 2 \
            --max_memory '6GB' \
            -w "$GITHUB_WORKSPACE/work/${taxid}"

          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            printf '%s\t%s\t%s\t%s\tnextflow-failed\n' "$taxid" "$species" "$annotation_url" "$fasta_url" >> "$retry_list"

            retry_workfile=$(find "$GITHUB_WORKSPACE/work/${taxid}" -name 'download_retry.tsv' -print -quit 2>/dev/null || true)
            if [[ -n "$retry_workfile" && -f "$retry_workfile" ]]; then
              tail -n +2 "$retry_workfile" >> "$retry_list" || true
            fi
          fi

          nextflow clean -f || true

          exit "$status"
            
      - name: Upload completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORFsearch-${{ matrix.taxid }}
          path: |
            ${{ github.event.inputs.output_dir || 'results-ci' }}/**/*SECIS.result
            ${{ github.event.inputs.output_dir || 'results-ci' }}/**/sequence_logos

      - name: Upload retry list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORFsearch-retry-list-${{ matrix.taxid }}
          path: retry-list.tsv

  aggregate-artifacts:
    needs:
      - nextflow
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all species artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ORFsearch-*
          path: aggregated-artifacts
          merge-multiple: true

      - name: Upload combined artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ORFsearch-all
          path: aggregated-artifacts  